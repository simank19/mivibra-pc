# Publica una versión de MiVibra PC: al subir una etiqueta vX.Y.Z se compila el .exe,
# se calcula su huella SHA-256 y se sube a Releases. Las apps instaladas se actualizan solas.
name: Publicar versión
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Versión
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Interfaz
        run: python3 build/assemble.py
      - name: Ícono y manifiesto
        run: |
          sed -i -E "s/version=\"[0-9.]+\"/version=\"${VER}.0\"/" build/mivibra.manifest
          go run github.com/akavel/rsrc@v0.10.2 -manifest build/mivibra.manifest -ico build/mivibra.ico -arch amd64 -o rsrc_windows_amd64.syso
      - name: Pruebas
        run: go test ./...
      - name: Compilar MiVibra-PC.exe
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w -X main.appVersion=${VER}" -o MiVibra-PC.exe .
      - name: Huella SHA-256
        run: sha256sum MiVibra-PC.exe > MiVibra-PC.exe.sha256
      - name: Paquete completo (.zip con carpetas)
        run: |
          mkdir -p "MiVibra-PC/Instaladores/Celulares" "MiVibra-PC/Instaladores/Drivers" "MiVibra-PC/Instaladores/Herramientas" "MiVibra-PC/Instaladores/Oficina" "MiVibra-PC/Instaladores/USB de rescate"
          cp MiVibra-PC.exe LÉEME.txt MiVibra-PC/
          zip -qr MiVibra-PC.zip MiVibra-PC
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          name: MiVibra PC ${{ env.VER }}
          body_path: NOVEDADES.md
          files: |
            MiVibra-PC.exe
            MiVibra-PC.exe.sha256
            MiVibra-PC.zip
