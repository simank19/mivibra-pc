<style>
:root{
  --bg:#0D0C0B;--side:#100F0E;--card:#151311;--card2:#1C1916;--line:#2A2622;--line2:#3A342E;
  --txt:#F3EFEA;--txt2:#CFC8BF;--mut:#A39C94;--na:#57514B;
  --or:#FF6900;--or2:#FF9A4D;--orbg:#2A1A0E;--ink:#140A02;
  --ok:#4ADE80;--okt:#86EFAC;--okbg:rgba(47,191,113,.12);
  --warn:#FBBF24;--warnt:#FCD34D;--warnbg:rgba(251,191,36,.10);
  --bad:#F87171;--badt:#FCA5A5;--badbg:rgba(248,113,113,.12);
  --fb:'Bricolage Grotesque',system-ui,sans-serif;--fu:'DM Sans',system-ui,sans-serif;--fm:'DM Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--fu);font-size:15px;line-height:1.45}
button,input{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2A2622;border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.wm{font-family:var(--fb);font-weight:800;font-size:21px;letter-spacing:-.2px;color:#fff}.wm i{font-style:normal;color:var(--or)}
.brand small{display:block;font-family:var(--fm);font-size:10px;letter-spacing:1.4px;color:var(--mut);margin-top:-2px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:transparent;color:var(--txt2);cursor:pointer;text-align:left;font-weight:500}
.nav:hover{background:#1A1715;color:var(--txt)}
.nav.on{background:var(--orbg);color:#fff}.nav.on svg{stroke:var(--or)}
.nav .bdg{margin-left:auto;font-family:var(--fm);font-size:11px;border-radius:999px;padding:1px 8px;background:var(--badbg);color:var(--badt)}
.side .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
main{overflow:auto;position:relative}
.page{max-width:1120px;margin:0 auto;padding:30px 40px 60px}
.eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:1.6px;color:var(--or2);text-transform:uppercase}
h1{font-family:var(--fb);font-weight:800;font-size:34px;line-height:1.08;letter-spacing:-.7px;color:#fff}
h1.xl{font-size:42px;letter-spacing:-.9px}
h2{font-family:var(--fb);font-weight:800;font-size:20px;color:#fff;letter-spacing:-.2px}
h3{font-family:var(--fm);font-weight:500;font-size:11px;letter-spacing:1.6px;color:var(--or2);text-transform:uppercase;margin:28px 0 10px;display:flex;justify-content:space-between;gap:10px}
h3 span{color:var(--mut);letter-spacing:0;text-transform:none}
p{color:var(--txt2);line-height:22px}
p b{color:#fff}
.mut{color:var(--mut);font-size:13.5px}
.mono{font-family:var(--fm)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.head .stack{display:flex;flex-direction:column;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card h2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card h2 .ic{width:34px;height:34px;border-radius:10px;background:var(--orbg);display:inline-flex;align-items:center;justify-content:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.kv>span:nth-child(odd){color:var(--mut)}
.kv>span:nth-child(even){text-align:right;font-family:var(--fm);font-size:13px;word-break:break-word}
.sep{height:1px;background:var(--line);margin:12px 0}
/* botones */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--or);color:var(--ink);white-space:nowrap}
.b:hover{filter:brightness(1.08)}.b:active{transform:scale(.98)}.b:disabled{opacity:.5;cursor:default}
.b.sec{background:transparent;color:var(--txt);border:1px solid var(--line2)}
.b.sec:hover{background:#1A1715}
.b.ok{background:var(--txt);color:var(--bg)}
.b.bad{background:transparent;color:var(--txt);border:1px solid var(--line2)}
.b.sm{min-height:34px;padding:6px 14px;font-size:13px}
.b.lg{min-height:54px;padding:12px 26px;font-size:16px}
.b.full{width:100%}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex-grow:1}
/* estado */
.dot{width:9px;height:9px;border-radius:999px;background:var(--na);flex-shrink:0;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.info{background:var(--or2)}
.pill{font-family:var(--fm);font-size:11.5px;padding:3px 10px;border-radius:999px;white-space:nowrap;color:var(--mut);background:var(--card2)}
.pill.ok{color:var(--okt);background:var(--okbg)}.pill.warn{color:var(--warnt);background:var(--warnbg)}.pill.bad{color:var(--badt);background:var(--badbg)}.pill.or{color:var(--or2);background:var(--orbg)}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid #221E1B}
.li:last-child{border-bottom:0}
.li .tx{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.li .tx b{font-weight:600;font-size:14.5px}.li .tx span{font-size:13px;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--or);transition:width .4s}
.ring{position:relative;flex-shrink:0}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-family:var(--fb);font-weight:800;line-height:1;color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile span{font-size:12px;color:var(--mut)}.tile b{font-family:var(--fm);font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.live .tile b{font-size:20px}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--or);border-radius:50%;animation:sp 1s linear infinite;margin:14px auto}
.spin.sm{width:18px;height:18px;border-width:3px;margin:0;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .25s ease-out}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px 16px;margin-top:14px;border:1px solid}
.verdict .vi{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.verdict b{display:block}.verdict small{display:block;font-size:13px;color:var(--txt2);margin-top:2px}
.verdict.ok{background:rgba(47,191,113,.08);border-color:rgba(74,222,128,.28)}.verdict.ok b{color:var(--okt)}.verdict.ok .vi{background:var(--ok)}
.verdict.warn{background:var(--warnbg);border-color:rgba(251,191,36,.3)}.verdict.warn b{color:var(--warnt)}.verdict.warn .vi{background:var(--warn)}
.verdict.bad{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3)}.verdict.bad b{color:var(--badt)}.verdict.bad .vi{background:var(--bad)}
.verdict.na{background:var(--card2);border-color:var(--line)}.verdict.na .vi{background:var(--na)}
/* pruebas */
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;color:var(--txt)}
.tcard:hover{border-color:var(--line2);background:#181614}
.tcard .ic{width:40px;height:40px;border-radius:12px;background:var(--orbg);display:flex;align-items:center;justify-content:center}
.tcard b{font-size:15px}.tcard span{font-size:12.5px;color:var(--mut)}
.segs{display:flex;gap:4px;margin:8px 0 22px}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segs i.ok{background:var(--or)}.segs i.bad{background:var(--bad)}.segs i.skip{background:var(--na)}.segs i.cur{background:#FFB77D}
.acts{display:flex;gap:10px;margin-top:22px}
.kb{display:flex;flex-direction:column;gap:6px;background:#0A0908;border:1px solid var(--line);border-radius:16px;padding:14px;user-select:none}
.kr{display:flex;gap:6px}
.k{flex:1 1 0;min-width:0;height:44px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:12px;color:var(--mut);transition:background .1s}
.k.on{background:var(--or);border-color:var(--or2);color:var(--ink);font-weight:500}
.k.now{box-shadow:0 0 0 2px #fff inset}
.pad{height:260px;border:2px dashed var(--line2);border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--mut);user-select:none;font-family:var(--fm);text-align:center}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pills .p{flex:1;min-width:110px;text-align:center;padding:14px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.pills .p.on{background:var(--okbg);border-color:rgba(74,222,128,.4);color:var(--okt)}
.meter{height:14px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--or2),var(--or));transition:width .08s}
video{width:100%;max-height:52vh;background:#000;border-radius:16px;margin-top:12px;object-fit:contain}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-bottom:40px;font-family:var(--fm);font-size:13px;cursor:pointer}
.check{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #221E1B;cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:#FF6900;flex-shrink:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);padding:11px 18px;border-radius:999px;z-index:90;font-size:14px}
.closed{position:fixed;inset:0;background:rgba(13,12,11,.92);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center}
.bench{display:flex;flex-direction:column;gap:12px}
.bench .res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gsq{border-radius:12px;font-family:var(--fb);font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.gsq.A{background:var(--okbg);color:var(--ok)}.gsq.B{background:var(--orbg);color:var(--or2)}.gsq.C{background:var(--badbg);color:var(--bad)}
.skel{background:linear-gradient(90deg,#161412,#201c19,#161412);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:1100px){.tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.cards3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.app{grid-template-columns:72px 1fr}.nav span,.brand .t,.side .foot .t,.nav .bdg{display:none}.cards,.cards3,.tiles,.live{grid-template-columns:1fr 1fr}.tgrid{grid-template-columns:1fr 1fr}.page{padding:22px}}
@media print{
  :root{--bg:#fff;--card:#fff;--card2:#f4f1ec;--line:#ddd;--txt:#111;--txt2:#333;--mut:#666}
  .side,.noprint{display:none!important}.app{display:block;height:auto}main{overflow:visible}
  h1,h2,.big,.wm{color:#111!important}.page{max-width:none;padding:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= MiVibra Instalador · interfaz 1.4 ================= */
.app{grid-template-columns:252px 1fr}
.page{padding:30px 40px 140px;max-width:1240px}
.side{gap:2px}
#nav{display:flex;flex-direction:column;gap:2px}
.cat{display:flex;align-items:center;gap:11px;width:100%;padding:8px 12px;border:0;border-radius:11px;background:transparent;color:var(--txt2);cursor:pointer;text-align:left;font-size:14px;min-height:38px;transition:background .12s,color .12s}
.cat svg{flex-shrink:0;color:var(--mut)}
.cat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat:hover{background:#1A1715;color:var(--txt)}.cat:hover svg{color:var(--txt2)}
.cat.on{background:var(--orbg);color:#fff;font-weight:600}.cat.on svg{color:var(--or)}
.cat em{margin-left:auto;font-style:normal;font-family:var(--fm);font-size:11px;color:var(--mut);padding-left:6px}
.sidelabel{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;cursor:pointer;font-family:var(--fm);font-size:10.5px;letter-spacing:1.5px;color:var(--mut);padding:16px 12px 6px;text-transform:uppercase;border-radius:8px}
.sidelabel:hover{color:var(--txt2)}
.grp{display:flex;flex-direction:column;gap:1px}
.hint{font-size:11.5px;line-height:15px;color:var(--mut)}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}

/* ---------- inicio ---------- */
.hero{position:relative;border-radius:28px;padding:34px 36px 30px;margin-bottom:26px;background:radial-gradient(120% 140% at 100% 0%,rgba(255,105,0,.20),rgba(255,105,0,0) 55%),linear-gradient(180deg,#171310,#120F0D);border:1px solid #2E2620;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:1px dashed rgba(255,154,77,.18)}
.hero h1{margin-top:8px}
.lead{color:var(--txt2);font-size:16px;margin-top:8px;max-width:620px}
.search{flex:1;min-width:220px;position:relative;display:flex;align-items:center}
.search>svg{position:absolute;left:15px;pointer-events:none}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:0 64px 0 42px;transition:border-color .12s,background .12s}
.search input::placeholder{color:#7D766F}
.search input:focus{outline:none;border-color:var(--or);background:#18140F}
.search kbd{position:absolute;right:12px;font-family:var(--fm);font-size:11px;color:var(--mut);border:1px solid var(--line2);border-radius:7px;padding:2px 7px;pointer-events:none}
.search .clr{position:absolute;right:8px;width:30px;height:30px;border-radius:999px;border:0;background:var(--card2);color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.search.big{margin-top:22px;max-width:720px}
.search.big input{height:58px;font-size:17px;padding-left:52px;background:rgba(13,12,11,.7);border-color:#3A3029}
.search.big>svg{left:19px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
.stat{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid #2E2620;background:rgba(21,19,17,.75);border-radius:16px;padding:12px 14px;color:var(--txt2);cursor:pointer;font-size:13.5px;transition:border-color .12s,transform .12s}
.stat:hover{border-color:var(--line2);transform:translateY(-1px)}
.stat .si{width:36px;height:36px;border-radius:11px;background:var(--orbg);color:var(--or2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat b{font-family:var(--fb);font-size:20px;color:#fff;font-weight:800}
.stat small{display:block;font-size:11.5px;color:var(--mut)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:32px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:21px}.sec-h p{margin-top:2px}
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kit{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.kit:hover{border-color:var(--line2)}
.kit.on{border-color:rgba(74,222,128,.45);background:#121A14}
.kit b{font-family:var(--fb);font-size:17px;font-weight:800;color:#fff;margin-top:6px}
.kit .mut{font-size:12.5px}
.kit .b{margin-top:10px}
.kh{display:flex;align-items:center;justify-content:space-between}
.ki{width:42px;height:42px;border-radius:13px;background:var(--orbg);color:var(--or2);display:flex;align-items:center;justify-content:center}
.kit.on .ki{background:var(--okbg);color:var(--okt)}
.kdel{opacity:0;width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .12s}
.kit:hover .kdel,.kdel:focus-visible{opacity:1}.kdel:hover{background:var(--badbg);color:var(--badt)}
.stack-av{display:flex;align-items:center;margin-top:6px}
.stack-av .av{border:2px solid var(--card);margin-right:-7px;border-radius:9px!important}
.more-n{margin-left:12px;font-family:var(--fm);font-size:11.5px;color:var(--mut)}
.b.ok{background:var(--okbg);color:var(--okt);border:1px solid rgba(74,222,128,.35)}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ctile{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;text-align:left;font-size:14px;transition:border-color .12s,background .12s}
.ctile:hover{border-color:var(--line2);background:#191613}
.ctile .ci{width:34px;height:34px;border-radius:10px;background:var(--card2);color:var(--or2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ctile .cn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ctile em{font-style:normal;font-family:var(--fm);font-size:11.5px;color:var(--mut)}
.empty{display:flex;align-items:center;gap:16px;border:1.5px dashed var(--line2);border-radius:20px;padding:18px 22px;margin-bottom:18px;flex-wrap:wrap}
.empty>div{flex:1;min-width:240px}.empty b{font-family:var(--fb);font-size:17px;color:#fff}.empty p{margin-top:2px}

/* ---------- catálogo ---------- */
.head{margin-bottom:18px}
.head .mut{font-size:13px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mut);margin:-4px 0 16px;line-height:20px}
.note svg{flex-shrink:0;margin-top:3px}
.note .code{white-space:nowrap}
.tools{position:sticky;top:0;z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0;margin:0 0 6px;background:linear-gradient(180deg,var(--bg) 82%,rgba(13,12,11,0))}
.segc{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.sg{border:0;background:transparent;color:var(--txt2);font-size:13px;padding:0 14px;height:36px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.sg:hover{color:#fff}
.sg.on{background:var(--txt);color:var(--bg);font-weight:700}
.segc.ic .sg{padding:0 10px}
.segc.wide{display:flex;border-radius:16px;padding:4px;width:100%}
.segc.wide .sg{flex:1;height:auto;padding:10px 12px;border-radius:12px;flex-direction:column;align-items:flex-start;gap:2px;font-weight:600}
.segc.wide .sg svg{display:none}
.segc.wide .sg small{font-weight:400;font-size:11.5px;color:inherit;opacity:.75}
.segc.wide .sg.on{background:var(--orbg);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,105,0,.5)}
select{height:42px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:0 14px;font-family:inherit;font-size:13px;cursor:pointer}
.ib{width:42px;height:42px;flex-shrink:0;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.ib:hover{background:#1E1A17;color:#fff}.ib.sm{width:30px;height:30px;border:0;background:transparent}
.grp-h{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px}
.grp-h h3{margin:0;display:flex;align-items:center;gap:8px}
.grp-h h3 svg{color:var(--or2)}
.lnk.sm{font-size:12.5px;padding:4px 6px;display:inline-flex;align-items:center;gap:5px}
.lnk:hover{color:var(--txt)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:10px}
.prog{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;user-select:none;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s;min-width:0}
.prog:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.prog.sel{border-color:var(--or);background:#1D140C;box-shadow:0 0 0 1px var(--or) inset}
.ph{display:flex;align-items:center;gap:11px;min-width:0}
.pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pt b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.av{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-family:var(--fb);font-weight:800;font-size:16px;letter-spacing:-.3px;overflow:hidden;background:var(--card2);color:var(--or2)}
.av.img{background:#1E1A17}.av img{width:70%;height:70%;object-fit:contain}
.ck{width:24px;height:24px;border-radius:999px;border:2px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;align-self:flex-start;transition:background .12s,border-color .12s}
.ck svg{opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s}
.prog:hover .ck,.lrow:hover .ck{border-color:#5A5148}
.sel .ck{background:var(--or);border-color:var(--or)!important}.sel .ck svg{opacity:1;transform:none}
.ds{font-size:13px;line-height:18px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;padding-right:4px}
.pm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-right:30px;min-height:22px}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mut)}
.src svg{opacity:.8}
.m{font-family:var(--fm);font-size:11px;color:var(--mut);padding-left:6px;border-left:1px solid var(--line2);display:inline-flex;align-items:center;gap:4px;line-height:12px}
.m.star{color:#FFC861}.m.star svg{fill:#FFC861;stroke:#FFC861}
.inst{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--okt)}
.chip-s{font-family:var(--fm);font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--mut)}
.chip-s.warn{background:var(--warnbg);color:var(--warnt)}
.prog .more,.lrow .more{position:absolute;right:8px;bottom:7px;width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .12s,background .12s}
.prog:hover .more,.lrow:hover .more,.more:focus-visible{opacity:1}
.more:hover{background:var(--card2);color:var(--txt)}
/* lista */
.ltable{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lrow{position:relative;display:grid;grid-template-columns:24px 34px minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.6fr) 96px 30px;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid #221E1B;cursor:pointer;user-select:none}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:#181512}
.lrow.sel{background:#1D140C}
.lrow .ck{align-self:center}
.ln{display:flex;flex-direction:column;min-width:0}
.ln b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln span,.lc{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.lrow .more{position:static}

/* ---------- barra inferior ---------- */
.dock{position:fixed;left:252px;right:0;bottom:0;z-index:20;padding:0 28px 16px;pointer-events:none}
.dbar{pointer-events:auto;max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;background:rgba(22,19,17,.94);border:1px solid var(--line2);border-radius:22px;padding:10px 10px 10px 14px;backdrop-filter:blur(10px);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.dock.idle .dbar{background:rgba(18,16,14,.9);border-color:var(--line)}
.selbtn{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--txt);cursor:pointer;padding:4px 8px 4px 4px;border-radius:14px;min-width:0;text-align:left}
.selbtn:hover{background:#1F1B18}
.selbtn .stack-av{margin:0}
.selbtn .stack-av .av{border-color:#161311}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true"><polygon points="24,3 42,13.5 42,34.5 24,45 6,34.5 6,13.5" fill="none" stroke="#FF6900" stroke-width="3" stroke-linejoin="round"/><g stroke="#FF6900" stroke-width="1.8"><line x1="24" y1="24" x2="24" y2="13"/><line x1="24" y1="24" x2="33.5" y2="18.5"/><line x1="24" y1="24" x2="33.5" y2="29.5"/><line x1="24" y1="24" x2="24" y2="35"/><line x1="24" y1="24" x2="14.5" y2="29.5"/><line x1="24" y1="24" x2="14.5" y2="18.5"/></g><g fill="#FF6900"><circle cx="24" cy="24" r="3.4"/><circle cx="24" cy="13" r="2.3"/><circle cx="33.5" cy="18.5" r="2.3"/><circle cx="33.5" cy="29.5" r="2.3"/><circle cx="24" cy="35" r="2.3"/><circle cx="14.5" cy="29.5" r="2.3"/><circle cx="14.5" cy="18.5" r="2.3"/></g></svg><div class="t"><div class="wm">Mi<i>Vibra</i></div><small>PC</small></div></div>
    <div id="modes"></div>
    <nav id="nav"></nav>
    <div class="foot"><div id="adm" style="display:flex;flex-direction:column;gap:8px"></div><div id="upd"></div><button class="verb t" id="ver" title="Versión y actualizaciones"></button></div>
  </aside>
  <main id="main"></main>
</div>
<script>
'use strict';
/* ===================== MiVibra PC 2 · shell ===================== */
/* Une los dos módulos: Diagnóstico (DIAG) e Instalador (INST). Cada uno pinta #nav y #main cuando está activo. */
const SHELL = (() => {
  const TOKEN = (location.hash.match(/t=([a-f0-9]+)/) || [])[1] || sessionStorage.getItem('mvtok') || '';
  let mode = 'diag';
  try { mode = localStorage.getItem('mv.mode') || 'diag'; } catch (e) {}
  if (!['diag', 'inst'].includes(mode)) mode = 'diag';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const svg = (p, s) => '<svg width="' + (s || 18) + '" height="' + (s || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
  const ICS = {
    diag: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
    inst: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
    arrow: '<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>'
  };
  const MODES = [['diag', 'Diagnóstico', 'Revisa el equipo'], ['inst', 'Instalador', 'Programas y drivers']];
  function tabs() {
    const el = document.querySelector('#modes'); if (!el) return;
    el.innerHTML = MODES.map(m => '<button class="mode' + (mode === m[0] ? ' on' : '') + '" data-mode="' + m[0] + '" title="' + m[1] + ' · ' + m[2] + '"><span class="mi">' + svg(ICS[m[0]], 18) + '</span><span class="mt"><b>' + m[1] + '</b><small>' + m[2] + '</small></span></button>').join('');
    el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => sw(b.dataset.mode));
  }
  function sw(m, after) {
    if (m === mode) { if (after) after(); return; }
    (mode === 'diag' ? DIAG : INST).unmount();
    mode = m; try { localStorage.setItem('mv.mode', m); } catch (e) {}
    document.body.dataset.mode = m;
    tabs();
    const M = m === 'diag' ? DIAG : INST;
    M.mount(); if (after) after();
    document.querySelector('#main').scrollTop = 0;
  }

  /* ---------- recomendaciones: problemas del diagnóstico → programas del instalador ---------- */
  const RULES = [
    { t: /antivirus|amenaza|virus/i, ids: ['w:Malwarebytes.Malwarebytes'], why: 'Segunda opinión: elimina adware y malware que otros antivirus no ven' },
    { a: /Almacenamiento/, t: /disco|ssd|smart/i, not: /espacio|lleno/i, ids: ['w:CrystalDewWorld.CrystalDiskInfo', 'w:CrystalDewWorld.CrystalDiskMark', 'g:rescuezilla/rescuezilla'], why: 'Para vigilar la salud del disco y clonarlo antes de que falle' },
    { t: /espacio|lleno/i, ids: ['g:Klocman/Bulk-Crap-Uninstaller'], why: 'Para quitar programas que ocupan espacio' },
    { a: /Temperatura/, ids: ['g:LibreHardwareMonitor/LibreHardwareMonitor', 'w:CPUID.HWMonitor'], why: 'Para medir temperaturas mientras lo pruebas' },
    { a: /Controladores/, ids: ['g:lostindark/DriverStoreExplorer', 'w:REALiX.HWiNFO'], why: 'Para revisar y limpiar controladores' },
    { t: /memoria RAM|errores de hardware|pantallazo/i, not: /insuficiente|poca/i, ids: ['g:memtest86plus/memtest86plus', 'w:REALiX.HWiNFO'], why: 'Para probar la RAM a fondo desde una USB' },
    { t: /arrancan con Windows/i, ids: ['g:winsiderss/systeminformer', 'g:Klocman/Bulk-Crap-Uninstaller'], why: 'Para controlar lo que se ejecuta al encender' }
  ];
  function recs() {
    const s = DIAG.summary(); if (!s) return [];
    const out = [], seen = new Set();
    s.issues.forEach(x => RULES.forEach(r => {
      if ((r.a && !r.a.test(x.area)) || (r.t && !r.t.test(x.title)) || (r.not && r.not.test(x.title))) return;
      r.ids.forEach(id => { if (!seen.has(id) && INST.has(id)) { seen.add(id); out.push({ id, why: r.why, issue: x.title, sev: x.sev }); } });
    }));
    return out;
  }
  function drawRecs(el) {
    if (!el) return;
    const r = recs();
    if (!r.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="xcard"><div class="xh"><span class="xi">' + svg(ICS.inst, 20) + '</span><div class="grow"><b>Programas que ayudan con lo encontrado</b><small>Desde el Instalador, con un clic</small></div><button class="b sm" id="xgo">Marcarlos en el instalador ' + svg(ICS.arrow, 15) + '</button></div>' +
      '<div class="xlist">' + r.map(x => { const it = INST.item(x.id) || {}; return '<div class="xr"><span class="dot ' + x.sev + '"></span><span class="grow"><b>' + esc(it.name || x.id) + '</b><small>' + esc(x.why) + ' · por «' + esc(x.issue) + '»</small></span>' + (it.installed ? '<span class="pill ok">Ya instalado</span>' : '') + '</div>'; }).join('') + '</div></div>';
    el.querySelector('#xgo').onclick = () => sw('inst', () => INST.recommend(r.filter(x => !(INST.item(x.id) || {}).installed).map(x => x.id), 'Recomendados por el diagnóstico'));
  }
  /* tarjeta del estado del equipo en el inicio del instalador */
  function healthCard() {
    const s = DIAG.summary();
    const col = { A: '#4ADE80', B: '#FF9A4D', C: '#F87171' };
    if (!s) return '<button class="xcard xs" data-shell="diag"><span class="xi"><span class="spin sm"></span></span><span class="grow"><b>Analizando este equipo…</b><small>El diagnóstico corre en segundo plano</small></span>' + svg(ICS.arrow, 16) + '</button>';
    const r = recs().filter(x => !(INST.item(x.id) || {}).installed);
    return '<div class="xcard xs"><span class="grade" style="color:' + col[s.grade] + ';border-color:' + col[s.grade] + '">' + s.grade + '</span><span class="grow"><b>' + esc((s.device.maker + ' ' + s.device.model).trim()) + ' · ' + ({ A: 'Excelente estado', B: 'Buen estado con detalles', C: 'Requiere atención' }[s.grade]) + '</b><small>' + s.nb + ' problema' + (s.nb === 1 ? '' : 's') + ' · ' + s.nw + ' aviso' + (s.nw === 1 ? '' : 's') + (r.length ? ' · ' + r.length + ' programa' + (r.length > 1 ? 's' : '') + ' recomendado' + (r.length > 1 ? 's' : '') : '') + '</small></span>' +
      (r.length ? '<button class="b sm" data-shell="recs">Marcar recomendados</button>' : '') + '<button class="b sec sm" data-shell="diag">Ver diagnóstico ' + svg(ICS.arrow, 14) + '</button></div>';
  }
  function bindShell(root) {
    root.querySelectorAll('[data-shell]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      if (b.dataset.shell === 'diag') sw('diag');
      else INST.recommend(recs().filter(x => !(INST.item(x.id) || {}).installed).map(x => x.id), 'Recomendados por el diagnóstico');
    });
  }
  let chT = 0;

/* Altavoces */
let AC = null;
function tone(pan, kind) {
  AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume();
  const o = AC.createOscillator(), g = AC.createGain(), p = AC.createStereoPanner ? AC.createStereoPanner() : null;
  const t0 = AC.currentTime;
  if (kind === 'sweep') { o.frequency.setValueAtTime(60, t0); o.frequency.exponentialRampToValueAtTime(12000, t0 + 5); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.1); g.gain.setValueAtTime(0.35, t0 + 4.8); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 5); o.start(t0); o.stop(t0 + 5.05); }
  else { [523, 659, 784, 1047].forEach((f, i) => o.frequency.setValueAtTime(f, t0 + i * 0.25)); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.03); g.gain.setValueAtTime(0.5, t0 + 0.95); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.05); o.start(t0); o.stop(t0 + 1.1); }
  if (p) { p.pan.value = pan; o.connect(g); g.connect(p); p.connect(AC.destination); } else { o.connect(g); g.connect(AC.destination); }
}
function tSpeakers(t) {

/* Micrófono */
function tMic(t) {
  return step(t, '<p>Activa el micrófono y habla o aplaude. Si la barra se mueve, la prueba pasa sola. Si Windows bloquea el acceso, revisa los permisos de privacidad.</p><button class="b" id="go">' + icon('mic', '#140A02', 17) + 'Activar micrófono</button><div class="meter"><i id="mt"></i></div><p class="mut" id="mn" style="margin-top:10px"></p><button class="b sec sm" data-run="privacymic" style="margin-top:6px">Privacidad del micrófono</button>', fin => {
    let stream = null, ctx = null, raf = 0, hits = 0;
    bindActs($q('#tb'));
    $('#go').onclick = async () => {
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
      catch (e) { $('#mn').textContent = e.name === 'NotAllowedError' ? 'Permiso denegado. Permite el micrófono e inténtalo de nuevo.' : 'No se encontró micrófono.'; return; }
      $('#go').disabled = true; $('#go').textContent = 'Escuchando…';
      const tr = stream.getAudioTracks()[0]; $('#mn').textContent = 'Dispositivo: ' + (tr && tr.label || 'micrófono');
      ctx = new AudioContext(); const an = ctx.createAnalyser(); an.fftSize = 1024; ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      const loop = () => { an.getByteTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; } const l = Math.min(1, Math.sqrt(s / buf.length) * 6); $('#mt').style.width = l * 100 + '%'; if (l > 0.22) hits++; if (hits > 15) return autoOk(fin, 'Capta sonido · ' + (tr && tr.label || '')); raf = requestAnimationFrame(loop); };
      loop();
    };
    return () => { cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(x => x.stop()); if (ctx) ctx.close().catch(() => {}); };
  });

/* USB */
function tUSB(t) {
  return step(t, '<p>Conecta una memoria USB, mouse o celular <b>en cada puerto, uno por uno</b>. Cada vez que Windows detecte algo nuevo aparecerá en la lista.</p><div class="card" style="margin-top:12px"><div class="row"><b class="grow">Detectados</b><span class="spin sm" id="us"></span></div><div id="ul" class="mut" style="margin-top:8px">Esperando dispositivos…</div></div>', fin => {
    let base = null, alive = true; const found = [];
    const poll = async () => {
      while (alive) {
        try {
          const d = arr(await api('/api/usb'));
          const ids = new Set(d.map(x => x.id));
          if (base === null) base = ids;
          else d.forEach(x => { if (!base.has(x.id) && !found.some(f => f.id === x.id)) { found.push({ id: x.id, name: x.name, at: new Date() }); } });
          if (base) base = new Set([...base].filter(id => ids.has(id)).concat(found.map(f => f.id)));
          if (found.length) $('#ul').innerHTML = found.map((f, k) => '<div class="row" style="padding:6px 0;color:var(--txt)"><span class="dot ok"></span><span class="grow">' + esc(f.name || f.id) + '</span><span class="mono mut" style="font-size:12px">conexión ' + (k + 1) + ' · ' + f.at.toLocaleTimeString('es-CO') + '</span></div>').join('');
        } catch (e) {}
        await sleep(2500);
      }
    };
    poll();
    const okb = main.querySelector('[data-r="ok"]');
    okb.onclick = () => fin('ok', found.length ? found.length + ' conexión(es) detectada(s)' : 'Confirmado por el usuario');
    return () => { alive = false; };
  }, { labels: ['Todos los puertos funcionan', 'Algún puerto falla'] });
}

async function runTests() {

  }

}

const BENCH = {

  ram: { name: 'Memoria RAM', ico: 'ram', desc: 'Escribe y verifica patrones en una parte de la memoria libre para detectar errores.', secs: 8 },

function benchResult(k) {
  const r = D.bench[k]; if (!r) return '';
  if (r.err) return '<div class="verdict bad"><span class="vi">' + icon('close', '#2A0606', 14, 3) + '</span><span><b>No se pudo completar</b><small>' + esc(r.err) + '</small></span></div>';
  const tile = (l, v) => '<div class="tile"><span>' + l + '</span><b>' + v + '</b></div>';
  const verdict = (sev, t, d) => '<div class="verdict ' + sev + '"><span class="vi">' + icon(sev === 'ok' ? 'check' : sev === 'warn' ? 'warn' : 'close', '#140A02', 14, 3) + '</span><span><b>' + t + '</b><small>' + d + '</small></span></div>';
  if (k === 'cpu') return '<div class="res">' + tile('Un núcleo', r.single + ' MB/s') + tile('Todos los núcleos (' + r.threads + ')', r.multi + ' MB/s') + tile('Escalado', r.scaling + '×') + tile('Pérdida bajo carga', Math.max(0, r.drop) + ' %') + '</div>' +
    (r.drop > 25 ? verdict('warn', 'Pierde velocidad al calentarse', 'Bajó ' + Math.round(r.drop) + ' % en 8 segundos: revisar ventilación y pasta térmica.') : verdict('ok', 'Rendimiento estable', 'Mantiene la velocidad bajo carga continua.'));
  if (k === 'ram') return '<div class="res">' + tile('Escritura', r.write + ' GB/s') + tile('Lectura', r.read + ' GB/s') + tile('Memoria probada', r.mb + ' MB') + tile('Errores', r.errors) + '</div>' +
    (r.errors > 0 ? verdict('bad', 'Se encontraron errores', 'La RAM puede estar dañada. Ejecuta el Diagnóstico de memoria de Windows (mdsched) para confirmarlo.') : verdict('ok', 'Sin errores', 'La memoria probada responde correctamente.'));
  if (k === 'disk') { const cls = r.read >= 1500 ? ['ok', 'SSD NVMe rápido'] : r.read >= 400 ? ['ok', 'Velocidad de SSD'] : r.read >= 150 ? ['warn', 'SSD lento o disco híbrido'] : ['bad', 'Velocidad de disco mecánico o con problemas'];
    return '<div class="res">' + tile('Lectura secuencial', Math.round(r.read) + ' MB/s') + tile('Escritura secuencial', Math.round(r.write) + ' MB/s') + tile('Lecturas aleatorias 4K', r.iops.toLocaleString('es-CO') + ' IOPS') + tile('Latencia', r.latMs + ' ms') + '</div>' + verdict(cls[0], cls[1], 'Probado en ' + esc(r.dir)); }
  if (k === 'net') return '<div class="res">' + tile('Internet', r.internet ? 'Conectado' : 'Sin conexión') + tile('Latencia', r.pingMs != null ? r.pingMs + ' ms' : '—') + tile('DNS', r.dns ? r.dnsMs + ' ms' : 'Falla') + tile('Descarga', r.downMbps != null ? r.downMbps + ' Mbps' : '—') + '</div>' +
    (!r.internet ? verdict('bad', 'Sin internet', 'Revisa el WiFi o el cable.') : r.pingMs > 150 ? verdict('warn', 'Conexión lenta', 'Latencia alta.') : verdict('ok', 'Conexión correcta', r.jitterMs != null ? 'Variación ' + r.jitterMs + ' ms' : ''));
}

const S = { gh: {}, ghPend: new Set(), stars: {}, items: [], profiles: {}, sel: new Set(), cat: 'home', filter: 'all', q: '', sort: 'rec', layout: 'grid', reboot: false, admin: false, winget: '', folder: '', view: 'grid', job: null, loading: true, types: {}, silent: {}, tray: false, fold: {} };
const LS = { get(k, d) { try { const v = localStorage.getItem('mvi.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('mvi.' + k, JSON.stringify(v)); } catch (e) {} } };
S.layout = LS.get('layout', 'grid'); S.fold = LS.get('fold', {}); S.sort = LS.get('sort', 'rec');

/* ---------- datos ---------- */
async function load(rescan) {
  try {
    const st = await api('/api/state' + (rescan ? '?rescan=1' : ''));
    Object.assign(S, { items: st.items || [], profiles: st.profiles || {}, admin: st.admin, winget: st.winget, folder: st.folder, types: st.types || {}, silent: st.silent || {}, loading: false });
    const ids = new Set(S.items.map(x => x.id));
    S.sel = new Set([...S.sel].filter(id => ids.has(id)));
  } catch (e) { S.loading = false; toast('No se pudo leer la biblioteca'); }
  render();
  SHELL.changed();
}
const visibleAll = () => S.items.filter(x => !x.hidden);
const isLibreCat = c => /^Libre · /.test(c || '');
const catLabel = c => (c || '').replace(/^Libre · /, '');
const starsOf = x => x.kind === 'github' ? (S.stars[x.repo] || x.stars || 0) : -1;
const fmtStars = n => n >= 1000 ? (n >= 10000 ? Math.round(n / 1000) : (n / 1000).toFixed(1).replace('.0', '').replace('.', ',')) + ' mil' : String(n);
const inScope = x => S.cat === 'all' || S.cat === 'home' || (S.cat === '@lib' ? x.kind === 'local' : S.cat === '@web' ? x.kind === 'winget' : S.cat === '@gh' ? x.kind === 'github' : x.category === S.cat);
function filtered() {
  const q = S.q.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const list = visibleAll().filter(x => inScope(x) &&
    (S.filter === 'all' || (S.filter === 'todo' ? !x.installed : x.installed)) &&
    (!words.length || (h => words.every(w => h.includes(w)))((x.name + ' ' + catLabel(x.category) + ' ' + (x.publisher || '') + ' ' + (x.wingetId || '') + ' ' + (x.file || '') + ' ' + (x.repo || '') + ' ' + (x.desc || '')).toLowerCase())));
  const ghView = S.cat === '@gh' || isLibreCat(S.cat);
  const sort = S.sort === 'rec' ? (ghView ? 'stars' : 'none') : S.sort;
  if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name, 'es'));
  else if (sort === 'stars') list.sort((a, b) => starsOf(b) - starsOf(a));
  if (q) list.sort((a, b) => (b.name.toLowerCase().startsWith(q) ? 1 : 0) - (a.name.toLowerCase().startsWith(q) ? 1 : 0));
  return list;
}
/* consulta la versión solo de los programas de GitHub que se están viendo (GitHub permite 60 consultas por hora) */
function ghLazy(list, force) {
  if (S.cat === 'all' && !S.q && !force) return;
  const need = list.filter(x => x.kind === 'github' && !S.gh[x.repo] && !S.ghPend.has(x.repo)).map(x => x.repo).slice(0, 40);
  if (!need.length) return;
  need.forEach(r => S.ghPend.add(r));
  api('/api/ghinfo?repos=' + encodeURIComponent(need.join(','))).then(g => { Object.assign(S.gh, g || {}); }).catch(() => { need.forEach(r => { S.gh[r] = S.gh[r] || { err: 'Sin conexión' }; }); })
    .finally(() => { need.forEach(r => S.ghPend.delete(r)); refreshCards(need); });
}
/* actualiza solo las tarjetas afectadas (sin perder scroll ni foco) */
function refreshCards(repos) {
  if (!ACTIVE()) return;
  if (S.view !== 'grid') return;
  repos.forEach(r => { const x = S.items.find(i => i.repo === r); if (!x) return; main.querySelectorAll('[data-id="' + CSS.escape(x.id) + '"]').forEach(el => { const n = document.createElement('div'); n.innerHTML = (el.classList.contains('lrow') ? row(x) : card(x)); const ne = n.firstElementChild; el.replaceWith(ne); bindCard(ne); }); });
}
const byId = id => S.items.find(x => x.id === id);

const catIcon = c => { for (const [re, k] of CAT_IC) if (re.test(c)) return k; return 'folder'; };
const HUES = [['#2A1A0E', '#FF9A4D'], ['#13222B', '#7CC7F2'], ['#1B2416', '#9BDB7A'], ['#271728', '#E39BEA'], ['#2A2210', '#F5C451'], ['#14232A', '#5FD4C4'], ['#2A1518', '#F59AA5'], ['#1C1B2E', '#A9A4F5']];
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; }

  if (op === 'install' && !S.admin) toast('Acepta el permiso de administrador de Windows');
  let r; try { r = await api('/api/install', { ids, op, reboot: op === 'install' && S.reboot }); } catch (e) { r = { ok: false, msg: 'Error de comunicación' }; }
  if (!r.ok) { toast(r.msg || 'No se pudo iniciar'); return; }
  S.view = 'queue'; S.job = null; render(); poll();
}
async function poll() {
  clearTimeout(pollT);
  try { const r = await api('/api/job'); if (r.job) { S.job = r.job; S.job.stale = r.stale; } } catch (e) {}
  if (S.view === 'queue') pQueue();
  if (S.job && !S.job.done && !S.job.stale) pollT = setTimeout(poll, 1000);
  else if (S.job && S.job.done) load();
}
const ST = { pending: ['', 'En espera'], running: ['run', 'Instalando…'], ok: ['ok', 'Listo'], error: ['error', 'Error'], cancelled: ['cancelled', 'Cancelado'] };
function ring(pct, color) {
  const r = 52, c = 2 * Math.PI * r;
  return '<svg width="128" height="128" viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="' + r + '" fill="none" stroke="#2A2622" stroke-width="10"/><circle cx="64" cy="64" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - pct / 100)) + '" transform="rotate(-90 64 64)" style="transition:stroke-dashoffset .6s"/></svg>';
}
function pQueue() {
  if (!ACTIVE()) return;
  const j = S.job;
  if (!j) { main.innerHTML = '<div class="page fade" style="max-width:820px"><div class="qhero"><div class="ring">' + ring(0, '#FF6900') + '<div class="in"><span class="spin sm"></span></div></div><div><span class="eyebrow">Preparando</span><h1>Esperando el permiso de Windows</h1><p class="mut">Acepta el aviso de «Control de cuentas de usuario». Si no lo ves, revisa la barra de tareas.</p></div></div></div>'; return; }
  const n = j.items.length, done = j.items.filter(x => ['ok', 'error', 'cancelled'].includes(x.status)).length;
  const ok = j.items.filter(x => x.status === 'ok').length, err = j.items.filter(x => x.status === 'error').length, can = j.items.filter(x => x.status === 'cancelled').length;
  const isDl = j.items[0] && j.items[0].op === 'download';
  const cur = j.items.find(x => x.status === 'running');
  const pct = Math.round(done / n * 100);
  const col = j.done ? (err && !ok ? '#F87171' : err ? '#FBBF24' : '#4ADE80') : '#FF6900';
  const head = j.done ? (err ? (ok ? 'Terminó con ' + err + ' error' + (err > 1 ? 'es' : '') : 'No se pudo ' + (isDl ? 'descargar' : 'instalar')) : can && !ok ? 'Cancelado' : (isDl ? 'Descargas listas' : '¡Todo instalado!')) : (isDl ? 'Descargando' : 'Instalando') + ' ' + Math.min(done + 1, n) + ' de ' + n;
  const sub = j.done ? (isDl ? 'Los instaladores quedaron en tu carpeta para usarlos sin internet.' : ok ? ok + ' programa' + (ok > 1 ? 's' : '') + ' listo' + (ok > 1 ? 's' : '') + ' en este equipo.' : 'Revisa el motivo de cada error abajo.') : cur ? (cur.op === 'download' ? 'Descargando ' : cur.mode === 'normal' ? 'Sigue los pasos del instalador de ' : 'Instalando en silencio ') + cur.name + '…' : 'Preparando…';
  const dur = s => { if (!s.start) return ''; const t = (s.end || Date.now() / 1000) - s.start; return t < 60 ? Math.max(1, Math.round(t)) + ' s' : Math.floor(t / 60) + ' min ' + Math.round(t % 60) + ' s'; };
  const total = j.started ? Math.max(1, Math.max(0, ...j.items.map(s => s.end || 0)) - j.started) : 0;
  main.innerHTML = '<div class="page fade" style="max-width:860px">' +
    '<div class="qhero"><div class="ring">' + ring(j.done ? 100 : pct, col) + '<div class="in">' + (j.done ? icon(err && !ok ? 'close' : err ? 'warn' : 'check', col, 34, 3) : '<b class="big" style="font-size:28px">' + pct + '%</b>') + '</div></div>' +
    '<div class="grow"><span class="eyebrow">' + (isDl ? 'Descarga al kit' : 'Instalación') + '</span><h1>' + esc(head) + '</h1><p class="mut" style="margin-top:6px">' + esc(sub) + '</p>' +
    (j.done ? '<div class="qstats"><span class="ok">' + icon('check', null, 13, 3) + ok + ' listo' + (ok === 1 ? '' : 's') + '</span>' + (err ? '<span class="bad">' + icon('close', null, 13, 3) + err + ' con error</span>' : '') + (can ? '<span>' + can + ' cancelado' + (can > 1 ? 's' : '') + '</span>' : '') + '<span>' + icon('clock', null, 13) + (total < 60 ? Math.round(total) + ' s' : Math.round(total / 60) + ' min') + '</span></div>' : '') + '</div></div>' +
    (j.stale && !j.done ? banner('warn', 'El instalador no responde', 'Puede que Windows esté mostrando una ventana del instalador detrás de esta. Revisa la barra de tareas.') : '') +
    (j.error ? '<div class="verdict bad" style="margin:0 0 14px"><span class="vi">' + icon('close', '#2A0606', 14, 3) + '</span><span><b>' + esc(j.error) + '</b></span></div>' : '') +
    '<div class="list">' + j.items.map(x => { const s = ST[x.status] || ['', x.status]; const it = byId(x.id) || { name: x.name, id: x.id };
      const ic = x.status === 'running' ? '<span class="spin sm"></span>' : x.status === 'ok' ? icon('check', '#06210F', 13, 3) : x.status === 'error' ? icon('close', '#2A0606', 13, 3) : x.status === 'cancelled' ? icon('close', '#0D0C0B', 12, 3) : '<i class="dotp"></i>';
      return '<div class="qrow ' + s[0] + '">' + avatar(it, 36) + '<span class="tx"><b>' + esc(x.name) + '</b><span>' + esc(x.status === 'pending' ? s[1] : x.status === 'running' ? (x.op === 'download' ? 'Descargando…' : x.mode === 'normal' ? 'Sigue los pasos del instalador…' : 'Instalando en silencio…') : x.msg || s[1]) + '</span></span><span class="time">' + dur(x) + '</span><span class="st ' + s[0] + '">' + ic + '</span></div>'; }).join('') + '</div>' +
    (j.done ? (j.rebootNeeded && !j.reboot ? banner('warn', 'Reinicia el equipo', 'Algunos programas necesitan reiniciar para terminar.') : '') +
      (j.reboot && ok ? banner('warn', 'El equipo se reiniciará en 1 minuto', 'Para cancelarlo ejecuta: shutdown /a') : '') +
      '<div class="row wrap" style="gap:10px;margin-top:20px"><button class="b" id="qback">' + icon('home', '#140A02', 15) + 'Volver al inicio</button>' + (err ? '<button class="b sec" id="qretry">' + icon('refresh', null, 15) + 'Reintentar los que fallaron</button><button class="b sec" id="qlog">' + icon('doc', null, 15) + 'Ver detalles técnicos</button>' : '') + (isDl && ok ? '<button class="b sec" id="qfold">' + icon('folder', null, 15) + 'Ver carpeta</button>' : '') + '</div>'
      : '<div class="row wrap" style="gap:12px;margin-top:20px"><button class="b sec" id="qcancel">' + icon('close', null, 15) + 'Cancelar lo que falta</button><span class="mut" style="font-size:12.5px">Puedes minimizar esta ventana; la instalación sigue.</span></div>') + '</div>';
  $('#qback').onclick = () => { S.view = 'grid'; S.sel.clear(); S.cat = 'home'; S.q = ''; render(); };
  $('#qretry').onclick = () => startJob(isDl ? 'download' : 'install', j.items.filter(x => x.status === 'error').map(x => x.id));
  $('#qfold').onclick = () => api('/api/open', { what: 'folder' });
  $('#qlog').onclick = () => api('/api/open', { what: 'log' });
  $('#qcancel').onclick = async () => { if (confirm('¿Cancelar las instalaciones pendientes? La que está en curso se detendrá.')) { await api('/api/cancel', {}); toast('Cancelando…'); } };
}

/* ---------- render y arranque (lo controla el shell) ---------- */
function render() { if (!ACTIVE()) return; renderSide(); if (S.view === 'queue') { pQueue(); renderDock(); } else pGrid(); }
async function init() {
  await load();
  api('/api/ghstars').then(g => { S.stars = g || {}; if (S.view === 'grid' && !$q('.modal')) keepScroll(pGrid); }).catch(() => {});
  try { const r = await api('/api/job'); if (r.job && !r.job.done && !r.stale) { S.job = r.job; S.view = 'queue'; render(); poll(); } } catch (e) {}
}
function mount() { render(); }
function unmount() { const dk = document.querySelector('#dock'); if (dk) dk.remove(); S.tray = false; }
/* abre el instalador con programas ya marcados (recomendados por el diagnóstico) */
function recommend(ids, title) { ids.filter(id => byId(id)).forEach(id => S.sel.add(id)); S.cat = 'home'; S.q = ''; S.view = S.job && !S.job.done && !S.job.stale ? 'queue' : 'grid'; render(); main.scrollTop = 0; toast((title || 'Recomendados') + ': ' + ids.filter(id => byId(id)).length + ' programas marcados'); }
window.addEventListener('keydown', e => {
  if (!ACTIVE()) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '');
  if ((e.ctrlKey && e.key.toLowerCase() === 'k') || (e.key === '/' && !typing)) {
    if ($q('.modal') || S.view !== 'grid') return;
    e.preventDefault(); const i = $q('#q') || $q('#hq'); if (i) { i.focus(); i.select(); }
  }
  if (e.key === 'Escape' && typing && document.activeElement.id === 'q' && S.q) { S.q = ''; if (S.cat === 'all') S.cat = 'home'; pGrid(); }
});
return { init, mount, unmount, recommend, has: id => !!byId(id), item: id => byId(id), setAdmin(a) { S.admin = a; }, get busy() { return !!(S.job && !S.job.done && !S.job.stale); } };
})();

SHELL.start();

</script>
